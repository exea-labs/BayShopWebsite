<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2EEE6">
<link rel="icon" type="image/svg+xml" href="/exea-logo.svg">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preload" href="/fonts/source-serif-4-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
  /* Hidden start states only exist under .motion. If the app module has not
     marked the page ready within 2.5 s, drop .motion so nothing stays hidden. */
  (function (h) {
    h.classList.add("js");
    var q = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
    if (q && q.matches) return;
    h.classList.add("motion");
    setTimeout(function () { if (!h.hasAttribute("data-ready")) h.classList.remove("motion"); }, 2500);
  })(document.documentElement);
</script>
