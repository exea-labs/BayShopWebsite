name: Deploy to Firebase Hosting

# Serves bayshop.exealabs.org, which is a CNAME to exealabs-bayshop.web.app.
# Kept separate from deploy-pages.yml because that workflow builds with a
# /BayShopWebsite/ base path for the github.io URL; Firebase serves at the
# domain root, so this one builds with the default base of "/".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: firebase-hosting
      url: https://bayshop.exealabs.org/
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Authenticate to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.30.0 deploy --only hosting:exealabs-bayshop --non-interactive
